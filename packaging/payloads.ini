; Example GoldHEN AutoRun entry for the virtual-pad payload.
;
; Merge this into /data/GoldHEN/payloads.ini on the console (keep every other
; line that is already there). With this line present the payload starts by
; itself after every boot, so the Xbox pad just works without opening the
; LaunchPad each time.
;
; Paths:
;   /data/payloads/...        <- put xcp_payload.elf here
;   /user/data/payloads/...   <- some GoldHEN builds use this prefix instead
;
; Uncomment the one that matches where the file lives.

[AutoRun]
/data/payloads/xcp_payload.elf = 1
; /user/data/payloads/xcp_payload.elf = 1
